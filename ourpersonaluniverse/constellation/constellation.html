
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Personal Universe — Constellation</title>

    <link rel="stylesheet" href="cssconst/constyle.css">
</head>

<body>
    <a href="../ourpersonaluniverse.html" class="back-button">
        « Назад
    </a>
    <!-- ЗВЁЗДНЫЙ ФОН -->

    <div class="stars"></div>

    <!-- ОСНОВНОЙ ЭКРАН -->

    <main class="constellation-page">

        <p class="subtitle">✦ НАША ВСЕЛЕННАЯ ✦</p>

        <h1>Собери все сердца 💖</h1>

        <p class="description">
            Каждая звезда - часть нашей жизни
        </p>

        <!-- СОЗВЕЗДИЕ -->

        <div class="constellation-container">

            <svg class="constellation"
                 viewBox="0 0 1000 580"
                 xmlns="http://www.w3.org/2000/svg">

                <defs>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="5" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <!-- СКРУГЛЁННАЯ ЧЕТЫРЁХКОНЕЧНАЯ ЗВЕЗДА -->

                    <symbol id="star-four" viewBox="-20 -20 40 40">
                        <path d="
                            M 0,-18
                            Q 3,-3 18,0
                            Q 3,3 0,18
                            Q -3,3 -18,0
                            Q -3,-3 0,-18
                            Z
                        "/>
                    </symbol>

                    <!-- СКРУГЛЁННАЯ ПЯТИКОНЕЧНАЯ ЗВЕЗДА -->

                    <symbol id="star-five" viewBox="-20 -20 40 40">
                        <path d="
                            M 0,-19
                            Q 2,-19 4,-13
                            L 7,-7
                            Q 8,-5 11,-5
                            L 17,-4
                            Q 20,-3 17,-0
                            L 12,5
                            Q 10,7 11,10
                            L 12,17
                            Q 13,20 9,18
                            L 2,15
                            Q 0,14 -2,15
                            L -9,18
                            Q -13,20 -12,17
                            L -11,10
                            Q -10,7 -12,5
                            L -17,0
                            Q -20,-3 -17,-4
                            L -11,-5
                            Q -8,-5 -7,-7
                            L -4,-13
                            Q -2,-19 0,-19
                            Z
                        "/>
                    </symbol>
                </defs>

                <!-- СОЕДИНИТЕЛЬНЫЕ ЛИНИИ -->

                <g class="constellation-lines">

                    <line x1="90" y1="300" x2="260" y2="120"/>
                    <line x1="260" y1="120" x2="470" y2="230"/>
                    <line x1="470" y1="230" x2="700" y2="90"/>
                    <line x1="700" y1="90" x2="900" y2="280"/>
                    <line x1="900" y1="280" x2="750" y2="450"/>
                    <line x1="750" y1="450" x2="490" y2="390"/>
                    <line x1="490" y1="390" x2="260" y2="500"/>
                    <line x1="260" y1="500" x2="90" y2="300"/>
                    <line x1="470" y1="230" x2="490" y2="390"/>

                </g>

                <!-- ЗВЁЗДЫ -->

                <g class="stars-group" filter="url(#glow)">

                                        <!-- ЗВЕЗДА 1 — МОЯ, ОРАНЖЕВАЯ -->

                    <a href="stars/stars1/stars1.html" class="star-link">
                        <use href="#star-four"
                            x="70" y="280" width="40" height="40"
                            class="star interactive orange"
                            id="star1"/>
                    </a>

                    <!-- ЗВЕЗДА 2 — ЕЁ, ГОЛУБАЯ -->

                    <a href="stars/stars2/stars2.html" class="star-link">
                        <use href="#star-five"
                            x="240" y="100" width="40" height="40"
                            class="star interactive blue"
                            id="star2"/>
                    </a>

                    <!-- ЗВЕЗДА 3 — ДЕКОРАТИВНАЯ -->

                    <use href="#star-four"
                        x="455" y="215" width="30" height="30"
                        class="star decorative"/>

                    <!-- ЗВЕЗДА 4 — МОЯ, ОРАНЖЕВАЯ -->

                    <a href="stars/stars3/stars3.html" class="star-link">
                        <use href="#star-four"
                            x="680" y="70" width="40" height="40"
                            class="star interactive orange"
                            id="star3"/>
                    </a>

                    <!-- ЗВЕЗДА 5 — ЕЁ, ГОЛУБАЯ -->

                    <a href="stars/stars4/stars4.html" class="star-link">
                        <use href="#star-five"
                            x="880" y="260" width="40" height="40"
                            class="star interactive blue"
                            id="star4"/>
                    </a>

                    <!-- ЗВЕЗДА 6 — ДЕКОРАТИВНАЯ -->

                    <use href="#star-five"
                        x="735" y="435" width="30" height="30"
                        class="star decorative"/>

                    <!-- ЗВЕЗДА 7 — ДЕКОРАТИВНАЯ -->

                    <use href="#star-four"
                        x="245" y="485" width="30" height="30"
                        class="star decorative"/>

                </g>

            </svg>

        </div>
        <!-- ПРОГРЕСС СЕРДЕЦ -->

        <section class="hearts-progress">

            <h2>Наши маленькие достижения</h2>

            <div class="hearts-container" id="heartsContainer">

                <!-- СЕРДЦЕ 1 -->

                </svg>

                <!-- СЕРДЦЕ 2 -->
                <svg class="heart" viewBox="0 0 64 64">
                    <path class="heart-fill"
                        d="M32 56 C26 50 5 36 5 20 C5 10 12 5 21 5 C27 5 31 9 32 15 C34 9 39 5 45 5 C54 5 59 12 59 20 C59 36 38 50 32 56Z"/>
                    <path class="heart-outline"
                        d="M32 56 C26 50 5 36 5 20 C5 10 12 5 21 5 C27 5 31 9 32 15 C34 9 39 5 45 5 C54 5 59 12 59 20 C59 36 38 50 32 56Z"/>
                </svg>

                <!-- СЕРДЦЕ 3 -->
                <svg class="heart" viewBox="0 0 64 64">
                    <path class="heart-fill"
                        d="M32 56 C26 50 5 36 5 20 C5 10 12 5 21 5 C27 5 31 9 32 15 C34 9 39 5 45 5 C54 5 59 12 59 20 C59 36 38 50 32 56Z"/>
                    <path class="heart-outline"
                        d="M32 56 C26 50 5 36 5 20 C5 10 12 5 21 5 C27 5 31 9 32 15 C34 9 39 5 45 5 C54 5 59 12 59 20 C59 36 38 50 32 56Z"/>
                </svg>

                <!-- СЕРДЦЕ 4 -->
                <svg class="heart" viewBox="0 0 64 64">
                    <path class="heart-fill"
                        d="M32 56 C26 50 5 36 5 20 C5 10 12 5 21 5 C27 5 31 9 32 15 C34 9 39 5 45 5 C54 5 59 12 59 20 C59 36 38 50 32 56Z"/>
                    <path class="heart-outline"
                        d="M32 56 C26 50 5 36 5 20 C5 10 12 5 21 5 C27 5 31 9 32 15 C34 9 39 5 45 5 C54 5 59 12 59 20 C59 36 38 50 32 56Z"/>
                </svg>

                <!-- СЕРДЦЕ 5 -->
                <svg class="heart" viewBox="0 0 64 64">
                    <path class="heart-fill"
                        d="M32 56 C26 50 5 36 5 20 C5 10 12 5 21 5 C27 5 31 9 32 15 C34 9 39 5 45 5 C54 5 59 12 59 20 C59 36 38 50 32 56Z"/>
                    <path class="heart-outline"
                        d="M32 56 C26 50 5 36 5 20 C5 10 12 5 21 5 C27 5 31 9 32 15 C34 9 39 5 45 5 C54 5 59 12 59 20 C59 36 38 50 32 56Z"/>
                </svg>

            </div>

            <p class="hearts-message" id="heartsMessage">
                Впереди ещё столько прекрасных моментов!
            </p>

            <button class="reset-progress-button" id="resetProgressButton">
                Сбросить прогресс
            </button>
            
        </section>
    </main>

    <script src="../progress.js"></script>
    <script src="jsconst/constfunc.js"></script>

</body>
